title: Geun's Study
description: 개발 학습과 기술 정리를 담은 노트
lang: ko-KR

theme: just-the-docs
url: https://jasonlee228.github.io

# just-the-docs options
search_enabled: true
search:
  # Also split tokens on punctuation/brackets so Korean text glued to Latin by
  # a paren (e.g. "정렬(insertion") is separated into searchable words. Paired
  # with a Hangul-preserving trimmer in _includes/head_custom.html, this makes
  # Korean queries like "정렬" match tokens such as "정렬을" via trailing
  # wildcard. lunr's default tokenizer only splits on whitespace/-/ .
  tokenizer_separator: '/[\s\-\/(),.:;!?~|<>\[\]{}·]+/'
heading_anchors: true
color_scheme: light

aux_links:
  GitHub:
    - https://github.com/jasonlee228/jasonlee228.github.io
aux_links_new_tab: true

# Show a "back to top" link and edit metadata off by default
back_to_top: true
back_to_top_text: "맨 위로"

# Collapse long category trees in the sidebar by default
nav_external_links: []

exclude:
  - tools/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/
