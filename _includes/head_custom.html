{%- if site.search_enabled != false %}
<script>
// just-the-docs builds its lunr index asynchronously (after fetching
// search-data.json), so this synchronous override lands before the index is
// built. lunr's default trimmer strips leading/trailing non-\w characters, and
// Hangul is non-\w in JS, so it deletes Korean tokens entirely. Replace it with
// a trimmer that also preserves Hangul syllables (U+AC00–U+D7A3).
(function () {
  if (typeof lunr === "undefined") return;
  var hangulTrimmer = function (token) {
    return token.update(function (s) {
      return s
        .replace(/^[^\w\uac00-\ud7a3]+/, "")
        .replace(/[^\w\uac00-\ud7a3]+$/, "");
    });
  };
  lunr.Pipeline.registerFunction(hangulTrimmer, "hangulTrimmer");
  lunr.trimmer = hangulTrimmer;
})();
</script>
{%- endif %}
